<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<title>Top bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="muziris.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header class="mz tb {{theme}}" style="width: 100%; flex-wrap: wrap">
  <button class="select" type="button" aria-haspopup="listbox" aria-label="Website: {{website}}" style="width: auto; min-width: 230px; height: 34px">
    <span class="row" style="gap: 8px">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"></path></svg>
      <span class="strong">{{website}}</span>
      <span class="xs muted">{{meta}}</span>
    </span>
    <svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
  </button>
  <button class="select" type="button" aria-label="Search or jump to, Ctrl K" style="flex: 0 1 420px; height: 34px; color: var(--muted-foreground); background: var(--muted); border-color: var(--border)">
    <span class="row"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16M21 21l-4.3-4.3"></path></svg>Search customers, orders, products…</span>
    <span class="row" style="gap: 3px"><span class="kbd">Ctrl</span><span class="kbd">K</span></span>
  </button>
  <span style="flex: 1"></span>
  <button class="btn ghost icon" type="button" aria-label="Help and keyboard shortcuts"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"></path></svg></button>
  <button class="btn ghost" type="button" aria-haspopup="menu" style="height: 40px; padding: 0 6px 0 4px; gap: 10px">
    <span class="av">PR</span>
    <span class="col" style="gap: 0; text-align: left; line-height: 1.2"><span class="small strong">Priya Raman</span><span class="xs muted" style="font-weight: 400">Sales manager</span></span>
    <svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
  </button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"website":{"editor":"enum","options":["Muziris India","Muziris US"],"default":"Muziris India"},"dark":{"editor":"boolean","default":false},"$preview":{"width":1192,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    const website = this.props.website ?? 'Muziris India';
    return {
      website,
      meta: website === 'Muziris US' ? 'USD · CT' : 'INR · IST',
      theme: this.props.dark ? 'dark' : ''
    };
  }
}
</script>
</body>
</html>
