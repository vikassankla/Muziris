<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<title>Sidebar navigation</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="muziris.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav class="mz sb {{cls}}" aria-label="Main navigation">
  <div class="sb-brand">
    <span class="sb-mark" aria-hidden="true">M</span>
    <sc-if value="{{open}}" hint-placeholder-val="{{ true }}"><span>Muziris</span><span class="tag" style="margin-left: auto">Admin</span></sc-if>
  </div>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
    <sc-if value="{{g.showLabel}}" hint-placeholder-val="{{ true }}"><div class="sb-group">{{g.label}}</div></sc-if>
    <sc-if value="{{g.showRule}}" hint-placeholder-val="{{ false }}"><div class="hr" style="width: 28px; margin: 8px 0"></div></sc-if>
    <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
      <a class="{{it.cls}}" href="#" aria-label="{{it.aria}}" aria-current="{{it.current}}" title="{{it.label}}">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{it.icon}}"></path></svg>
        <sc-if value="{{open}}" hint-placeholder-val="{{ true }}"><span>{{it.label}}</span><span class="sb-count num">{{it.count}}</span></sc-if>
      </a>
    </sc-for>
  </sc-for>
  <div style="flex: 1"></div>
  <button class="sb-item" type="button" aria-label="{{toggleLabel}}" style="border: 0; background: none; font: inherit; color: var(--muted-foreground); cursor: pointer; width: 100%">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18v18H3zM9 3v18"></path></svg>
    <sc-if value="{{open}}" hint-placeholder-val="{{ true }}"><span>Collapse</span><span class="kbd" style="margin-left: auto">Ctrl B</span></sc-if>
  </button>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","orders","rfqs","quotes","customers","groups","products","categories","units","prices","adminusers","adminroles","buyerroles","websites","settings"],"default":"customers"},"collapsed":{"editor":"boolean","default":false},"dark":{"editor":"boolean","default":false},"$preview":{"width":248,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'customers';
    const collapsed = !!this.props.collapsed;
    const P = {
      home: 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z',
      orders: 'M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h4',
      rfqs: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z',
      quotes: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8',
      customers: 'M3 21h18M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M15 9h4a2 2 0 0 1 2 2v10M9 7h2M9 11h2M9 15h2',
      groups: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
      products: 'M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',
      categories: 'M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
      units: 'M3 17 17 3l4 4L7 21zM7 13l2 2M10 10l2 2M13 7l2 2',
      prices: 'M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8zM7.5 7.5h.01',
      adminusers: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',
      adminroles: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z',
      buyerroles: 'M2 18v3h3l7.6-7.6A5 5 0 1 0 10.6 11.4L2 18zM16 8h.01',
      websites: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20',
      settings: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6'
    };
    const def = [
      { label: null, items: [['home', 'Home', '']] },
      { label: 'Sales', items: [['orders', 'Orders', '38'], ['rfqs', 'RFQs', '17'], ['quotes', 'Quotes', '']] },
      { label: 'Customers', items: [['customers', 'Customers', ''], ['groups', 'Customer groups', '']] },
      { label: 'Catalog', items: [['products', 'Products', ''], ['categories', 'Categories', ''], ['units', 'Product units', '']] },
      { label: 'Pricing', items: [['prices', 'Price lists', '']] },
      { label: 'Access control', items: [['adminusers', 'Admin users', ''], ['adminroles', 'Admin roles', ''], ['buyerroles', 'Buyer roles', '']] },
      { label: 'Settings', items: [['websites', 'Websites', ''], ['settings', 'Settings', '']] }
    ];
    const groups = def.map((g, gi) => ({
      label: g.label,
      showLabel: !collapsed && !!g.label,
      showRule: collapsed && gi > 0,
      items: g.items.map(([k, label, count]) => ({
        label, count,
        icon: P[k],
        cls: 'sb-item' + (k === active ? ' on' : ''),
        current: k === active ? 'page' : 'false',
        aria: collapsed ? label : null
      }))
    }));
    return {
      cls: (collapsed ? 'collapsed' : '') + (this.props.dark ? ' dark' : ''),
      open: !collapsed,
      groups,
      toggleLabel: collapsed ? 'Expand sidebar' : 'Collapse sidebar'
    };
  }
}
</script>
</body>
</html>
