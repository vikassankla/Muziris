# The admin app on 8080 and the storefront on 8081, each on one origin with its API path, as
# the Vite dev servers proxy them: the __Host- session cookies stay first-party. The Host
# header is passed through unchanged, and the API checks Origin against CORS_ORIGINS.

# Request bodies are limited by the API; this only has to let the largest through
# (the 2 MB price import, ADR 0022).
client_max_body_size 3m;

server {
    listen 8080;
    root /srv/admin;

    location /admin/v1/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # The app's own routes, such as /products/123, load index.html.
    location / {
        include /etc/nginx/snippets/app-headers.conf;
        try_files $uri /index.html;
    }
}

server {
    listen 8081;
    root /srv/storefront;

    location /storefront/v1/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Payment gateway callbacks (ADR 0019), when test-mode keys are set.
    location /webhooks/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        include /etc/nginx/snippets/app-headers.conf;
        try_files $uri /index.html;
    }
}
