# Headers for the admin app's and the storefront's own files; the API sends its own. The
# content security policy itself is a meta tag in each built index.html, but frame-ancestors
# only works as a header: no other site may show either app in a frame. The pilot install's
# edge, deploy/Caddyfile, sends the same headers plus Strict-Transport-Security; keep the two
# the same (deploy/check-stack.sh compares them).
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
