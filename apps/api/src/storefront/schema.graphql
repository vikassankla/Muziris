type Query {
  viewer: Viewer!
  website: Website!

  """Every category the buyer may see, flat; build the tree from parentId."""
  categories: [Category!]!
  category(id: ID!): Category

  """
  One product by id or by SKU (in any letter case), if the buyer may see it.
  """
  product(id: ID, sku: String): Product

  """The products the buyer may see, by SKU, a page at a time."""
  products(
    categoryId: ID
    includeSubcategories: Boolean = false

    """How many to return, at most 50."""
    first: Int = 20

    """The previous page's nextAfter."""
    after: String
  ): ProductPage!

  """
  Products the buyer may see, ranked: exact SKU, SKU prefix, text, close match.
  """
  search(
    query: String!

    """How many to return, at most 50."""
    first: Int = 20
    offset: Int = 0
  ): SearchResults!

  """
  The totals the buyer would pay for these lines, with their prices and tax. Saves nothing.
  """
  checkoutPreview(input: CheckoutInput!): CheckoutPreviewResult!

  """Orders the buyer may see on this website, newest first."""
  orders(
    """How many to return, at most 50."""
    first: Int = 20

    """The previous page's nextAfter."""
    after: String
  ): OrderPage!

  """One order by its number, if the buyer may see it."""
  order(number: String!): Order

  """
  Shopping lists the buyer may see on this website, most recently changed first.
  """
  shoppingLists(
    """How many to return, at most 50."""
    first: Int = 20

    """The previous page's nextAfter."""
    after: String
  ): ShoppingListPage!

  """One shopping list, if the buyer may see it."""
  shoppingList(id: ID!): ShoppingList

  """
  Products the buyer may order, by SKU in any letter case, for quick order. At most 100 SKUs.
  """
  productsBySkus(skus: [String!]!): ProductsBySkusResult!
}

"""The signed-in buyer user."""
type Viewer {
  id: ID!
  email: String!
  displayName: String!
  customer: Customer!
}

"""The company the buyer user buys for."""
type Customer {
  id: ID!
  name: String!

  """Its addresses, to bill and ship an order to."""
  addresses: [Address!]!
}

"""One of the customer's billing or shipping addresses."""
type Address {
  id: ID!
  label: String!
  countryCode: String!
  line1: String!
  line2: String
  city: String!

  """India: the two-digit GST state code. US: the two-letter state code."""
  regionCode: String!
  postalCode: String!
  gstin: String
  isDefaultBilling: Boolean!
  isDefaultShipping: Boolean!
}

"""
The storefront this request is for, named by the Muziris-Website header.
"""
type Website {
  code: String!
  name: String!
  countryCode: String!
  currency: String!
  locale: String!
  timeZone: String!
  unitSystem: String!
}

type Category {
  id: ID!
  code: String!
  name: String!

  """Null at the top, and when the buyer may not see the parent."""
  parentId: ID

  """Order among siblings, lowest first."""
  position: Int!
}

type Product {
  id: ID!
  sku: String!
  name: String!

  """Null when the product has none, or the buyer may not see it."""
  category: Category
  attributes: [Attribute!]!
  primaryUnit: ProductUnit!

  """Every product unit the product is sold in, the primary one first."""
  units: [ProductUnit!]!

  """
  The price for a quantity in a product unit, or null when the buyer has no price for it.
  """
  price(
    """Defaults to the primary unit."""
    unitCode: String

    """A decimal string at the unit's precision."""
    quantity: String = "1"
  ): Price
}

type Attribute {
  key: String!

  """
  One value, or several for a list; true and false are "true" and "false".
  """
  values: [String!]!
}

type ProductUnit {
  code: String!
  name: String!

  """Digits a quantity in this unit may have after the decimal point."""
  precision: Int!
}

"""The buyer's price from their combined price list."""
type Price {
  unitPrice: Money!
  unitCode: String!

  """The quantity the price is for."""
  quantity: String!

  """The smallest quantity the price applies to (its tier)."""
  minQuantity: String!
}

type Money {
  """A decimal string in major units, for example "4.86"."""
  amount: String!

  """The amount in minor units (paise, cents), as a string of digits."""
  minorUnits: String!
  currency: String!
}

type ProductPage {
  nodes: [Product!]!

  """Pass as after to read the next page; null on the last page."""
  nextAfter: String
}

type SearchResults {
  nodes: [SearchHit!]!

  """Pass as offset to read the next page; null on the last page."""
  nextOffset: Int
}

type SearchHit {
  match: SearchMatch!
  product: Product!
}

"""How a product matched, best first."""
enum SearchMatch {
  SKU_EXACT
  SKU_PREFIX
  TEXT
  CLOSE
}

"""Exactly one of preview and refusal is set."""
type CheckoutPreviewResult {
  preview: CheckoutPreview
  refusal: CheckoutRefusal
}

type CheckoutPreview {
  totals: Totals!

  """Days to pay: 30 is net 30."""
  paymentTermDays: Int!

  """
  The day payment would be due if placed now (YYYY-MM-DD, the website's time zone).
  """
  dueOn: String!
}

type Totals {
  currency: String!
  lines: [OrderLine!]!
  taxes: [Tax!]!
  shippingMethod: String!

  """The sum of line subtotals."""
  subtotal: Money!

  """Line and order discounts together."""
  discount: Money!
  shipping: Money!
  shippingDiscount: Money!
  tax: Money!
  grandTotal: Money!
}

"""A line of a checkout or an order: what was bought and its price."""
type OrderLine {
  """1, 2, 3 in the order the buyer listed."""
  lineNo: Int!
  productId: ID!
  sku: String!
  productName: String!
  unitCode: String!
  unitName: String!
  quantity: String!
  unitPrice: Money!

  """Unit price times quantity."""
  subtotal: Money!
  discount: Money!

  """Subtotal less discount, before tax."""
  net: Money!

  """HSN or SAC in India."""
  taxCode: String
}

"""One tax charged: on a line, or on shipping when lineNo is null."""
type Tax {
  lineNo: Int

  """For example CGST, SGST or IGST."""
  name: String!

  """A decimal fraction: "0.09" is 9%."""
  rate: String!
  taxable: Money!
  amount: Money!
}

"""Why a checkout cannot go on. The message is safe to show the buyer."""
type CheckoutRefusal {
  code: CheckoutRefusalCode!
  message: String!

  """For ADDRESS_NOT_FOUND: which address."""
  addressRole: AddressRole

  """For LINE_PROBLEMS: each line that cannot be ordered, and why."""
  lines: [LineProblem!]!

  """
  For TAX_PROBLEMS: what stops tax being worked out, by line or for the order.
  """
  taxProblems: [TaxProblem!]!

  """For PRICES_CHANGED: the total the buyer sent."""
  expectedGrandTotal: Money

  """For PRICES_CHANGED: the totals now."""
  totals: Totals
}

enum CheckoutRefusalCode {
  NOT_ALLOWED
  WEBSITE_NOT_FOUND
  ADDRESS_NOT_FOUND
  LINE_PROBLEMS
  PRICES_CHANGED
  IDEMPOTENCY_KEY_REUSED
  TAX_PROBLEMS
  TAX_NOT_CONFIGURED
}

enum AddressRole {
  BILLING
  SHIPPING
}

type LineProblem {
  lineNo: Int!
  code: LineProblemCode!
  message: String!
}

enum LineProblemCode {
  PRODUCT_NOT_AVAILABLE
  UNIT_NOT_SOLD
  INVALID_QUANTITY
  NO_PRICE
}

type TaxProblem {
  """Null when the problem is the whole order."""
  lineNo: Int
  code: TaxProblemCode!
  message: String!
}

enum TaxProblemCode {
  NO_TAX_CODE
  NO_RATE
  NO_REGISTRATION
  CROSS_BORDER
}

input CheckoutInput {
  lines: [CheckoutLineInput!]!
  billingAddressId: ID!
  shippingAddressId: ID!
  purchaseOrderNumber: String
}

input CheckoutLineInput {
  productId: ID!
  unitCode: String!

  """A decimal string at the unit's precision."""
  quantity: String!
}

type OrderPage {
  nodes: [OrderSummary!]!

  """Pass as after to read the next page; null on the last page."""
  nextAfter: String
}

type OrderSummary {
  """For example MZ-000123."""
  number: String!
  step: OrderStep!

  """An ISO 8601 timestamp in UTC."""
  placedAt: String!
  customerName: String!
  purchaseOrderNumber: String
  grandTotal: Money!
}

"""Where an order is in its workflow."""
enum OrderStep {
  NEW
  CONFIRMED
  PROCESSING
  COMPLETED
  DECLINED
}

"""
A placed order. It keeps its own copy of lines, prices, tax and addresses.
"""
type Order {
  """For example MZ-000123."""
  number: String!
  step: OrderStep!

  """An ISO 8601 timestamp in UTC."""
  placedAt: String!
  customerName: String!
  purchaseOrderNumber: String
  grandTotal: Money!
  currency: String!
  lines: [OrderLine!]!
  taxes: [Tax!]!
  shippingMethod: String!

  """The sum of line subtotals."""
  subtotal: Money!

  """Line and order discounts together."""
  discount: Money!
  shipping: Money!
  shippingDiscount: Money!
  tax: Money!

  """TERMS: pay on invoice."""
  paymentMethod: String!
  paymentTermDays: Int!

  """YYYY-MM-DD."""
  dueOn: String!

  """
  The seller's registration the tax was charged under: a GSTIN or US permit.
  """
  sellerTaxId: String

  """
  The buyer's exemption certificate that made the order tax free, if one did.
  """
  taxExemptionCertificate: String
  billingAddress: OrderAddress!
  shippingAddress: OrderAddress!
}

"""An address as it was when the order was placed."""
type OrderAddress {
  label: String!
  countryCode: String!
  line1: String!
  line2: String
  city: String!
  regionCode: String!
  postalCode: String!
  gstin: String
}

type ShoppingListPage {
  nodes: [ShoppingListSummary!]!

  """Pass as after to read the next page; null on the last page."""
  nextAfter: String
}

type ShoppingListSummary {
  id: ID!
  name: String!
  lineCount: Int!

  """True when the signed-in buyer owns the list."""
  isOwn: Boolean!

  """An ISO 8601 timestamp in UTC."""
  updatedAt: String!
}

"""A list of products the buyer collects to order. It stores no prices."""
type ShoppingList {
  id: ID!
  name: String!
  lineCount: Int!

  """True when the signed-in buyer owns the list."""
  isOwn: Boolean!

  """An ISO 8601 timestamp in UTC."""
  updatedAt: String!

  """
  The lines in position order, a page at a time; a list holds at most 500.
  """
  lines(
    """How many to return, at most 50."""
    first: Int = 20

    """The previous page's nextAfter."""
    after: String
  ): ShoppingListLinePage!
}

type ShoppingListLinePage {
  nodes: [ShoppingListLine!]!

  """Pass as after to read the next page; null on the last page."""
  nextAfter: String
}

type ShoppingListLine {
  id: ID!

  """1, 2, 3 in the order the buyer sees."""
  position: Int!
  productId: ID!

  """Null when the buyer may no longer see or order the product."""
  product: Product
  unitCode: String!

  """A decimal string, such as "2.5"."""
  quantity: String!
  note: String

  """
  The buyer's price now for this line's unit and quantity; null without one.
  """
  price: Price
}

type ProductsBySkusResult {
  """The products found, in the order their SKUs were asked for."""
  products: [Product!]!

  """
  SKUs that are unknown, or that the buyer may not see or order, as sent.
  """
  missingSkus: [String!]!
}

type Mutation {
  """
  Places an order on payment terms. Everything is checked again; sending the same idempotency key again returns the same order.
  """
  placeOrder(input: PlaceOrderInput!): PlaceOrderResult!
  createShoppingList(name: String!): ShoppingListResult!
  renameShoppingList(listId: ID!, name: String!): ShoppingListResult!

  """
  A copy owned by the buyer, with the lines whose products they may still see.
  """
  duplicateShoppingList(listId: ID!, name: String!): ShoppingListResult!
  deleteShoppingList(listId: ID!): DeleteShoppingListResult!

  """
  Adds lines; the same product and unit adds to the line already there. Nothing is added when any line has a problem.
  """
  addShoppingListLines(listId: ID!, lines: [ShoppingListLineInput!]!): ShoppingListResult!

  """Changes a line's quantity, unit or note; leave out what stays."""
  updateShoppingListLine(
    listId: ID!
    lineId: ID!
    quantity: String
    unitCode: String

    """An empty string clears the note."""
    note: String
  ): ShoppingListResult!
  removeShoppingListLines(listId: ID!, lineIds: [ID!]!): ShoppingListResult!

  """
  Moves lines to another list, merging into lines there. Returns the target list.
  """
  moveShoppingListLines(fromListId: ID!, toListId: ID!, lineIds: [ID!]!): ShoppingListResult!
}

"""Exactly one of order and refusal is set."""
type PlaceOrderResult {
  order: Order

  """
  True when the idempotency key placed this order before, and it is returned again.
  """
  replayed: Boolean!
  refusal: CheckoutRefusal
}

input PlaceOrderInput {
  lines: [CheckoutLineInput!]!
  billingAddressId: ID!
  shippingAddressId: ID!
  purchaseOrderNumber: String

  """
  A UUID the client makes once per order attempt, and sends again on a retry.
  """
  idempotencyKey: ID!

  """
  The preview's grand total, as a decimal string; a different total refuses.
  """
  expectedGrandTotal: String!
}

"""Exactly one of list and refusal is set."""
type ShoppingListResult {
  list: ShoppingList
  refusal: ShoppingListRefusal
}

"""
Why a shopping list change was refused. The message is safe to show the buyer.
"""
type ShoppingListRefusal {
  code: ShoppingListRefusalCode!
  message: String!

  """For LINE_PROBLEMS: each line that cannot be added, and why."""
  lines: [ShoppingListLineProblem!]!
}

enum ShoppingListRefusalCode {
  NOT_ALLOWED
  LIST_NOT_FOUND
  LINE_NOT_FOUND
  TOO_MANY_LISTS
  TOO_MANY_LINES
  SAME_LIST
  LINE_PROBLEMS
}

type ShoppingListLineProblem {
  """The line in the request, from 0."""
  index: Int!
  code: ShoppingListLineProblemCode!
  message: String!
}

enum ShoppingListLineProblemCode {
  PRODUCT_NOT_AVAILABLE
  UNIT_NOT_SOLD
  INVALID_QUANTITY
}

type DeleteShoppingListResult {
  deleted: Boolean!
  refusal: ShoppingListRefusal
}

input ShoppingListLineInput {
  productId: ID!
  unitCode: String!

  """A decimal string at the unit's precision, above zero."""
  quantity: String!
  note: String
}
